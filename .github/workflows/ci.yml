name: CI

# Napkin holds the only copy of whatever someone threw at it, so the tests that
# matter are the ones about not losing it. They run on every push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.2

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 ships Qt 6.4; CMakeLists asks for 6.5. Installing Qt
      # explicitly also means Linux and Windows build against the same version,
      # so a failure is about the platform rather than about the toolchain.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev

      # What the runner actually gave us. Configure failed on both platforms on
      # the first three runs and the job log is not readable without admin
      # rights on the repository, so the facts needed to diagnose it have to
      # reach somewhere that is: ::error:: lines become annotations, and
      # annotations are public.
      - name: Show the toolchain
        run: |
          echo "QT_ROOT_DIR=${QT_ROOT_DIR:-unset}"
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-unset}"
          echo "qmake: $(command -v qmake || echo none)"
          echo "cmake: $(cmake --version | head -1)"
          ls "${QT_ROOT_DIR:-/nonexistent}/lib/cmake" 2>/dev/null | head -20 || echo "no Qt cmake dir"

      - name: Configure
        run: |
          set -o pipefail
          # CMAKE_PREFIX_PATH explicitly: find_package(Qt6) only searches it,
          # and whether install-qt-action exports it has changed between
          # versions of that action.
          # _GLIBCXX_ASSERTIONS makes an out-of-range operator[] abort instead of
          # quietly reading past the end. Arch's makepkg builds with it; CI did
          # not, so a test indexing thumbs[2] of a one-element vector passed
          # here for a day and only failed inside the PKGBUILD's check().
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" 2>&1 | tee configure.log || {
              echo "::error title=CMake configure failed::$(tail -c 3000 configure.log | tr '\n' ' ' | tr -s ' ')"
              exit 1
            }

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(grep -E 'error|Error' build.log | head -20 | tr '\n' ' ')"
            exit 1
          }

      # The GUI suites set QT_QPA_PLATFORM=offscreen themselves (CMakeLists),
      # so nothing here needs a display server.
      # Annotated like the others: a failing suite has to say WHICH suite and
      # why somewhere readable without admin rights on the repository.
      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --parallel 2 2>&1 | tee ctest.log || {
            echo "::error title=Tests failed::$(grep -E '^\s*[0-9]+ - |FAIL!|Errors while|tests passed' ctest.log | head -30 | tr '\n' ' ')"
            echo "::error title=First failure detail::$(grep -A4 'FAIL!' ctest.log | head -20 | tr '\n' ' ')"
            exit 1
          }

      # The same binaries again, against older SQLite. This runner has 3.45, and
      # the v0.1.0 release — built on ubuntu-22.04 with 3.37.2 — failed every
      # search that found anything: the query leaned on behaviour that only
      # arrived in 3.39, and nothing here could see it. 3.37.2 is the release
      # build host's; 3.31.1 is Ubuntu 20.04's and the oldest the suite has
      # been shown to pass on. Pinned by hash, so this cannot quietly test
      # against something else.
      - name: Test against older SQLite
        run: |
          set -euo pipefail
          check() {
            local name=$1 year=$2 sum=$3
            curl -fsSLO "https://www.sqlite.org/$year/sqlite-amalgamation-$name.zip"
            echo "$sum  sqlite-amalgamation-$name.zip" | sha256sum -c -
            unzip -q "sqlite-amalgamation-$name.zip"
            mkdir -p "old-sqlite/$name"
            gcc -O2 -w -shared -fPIC -DSQLITE_ENABLE_FTS5 \
              "sqlite-amalgamation-$name/sqlite3.c" \
              -o "old-sqlite/$name/libsqlite3.so.0" -lpthread -ldl -lm
            export LD_LIBRARY_PATH="$PWD/old-sqlite/$name"
            # Proof the substitution took, rather than a green run against the
            # system library that tested nothing.
            ldd build/test_search | grep -q "old-sqlite/$name/libsqlite3.so.0" || {
              echo "::error title=SQLite $name not loaded::$(ldd build/test_search | grep sqlite)"
              exit 1
            }
            ctest --test-dir build --output-on-failure --parallel 2 2>&1 | tee "ctest-$name.log" || {
              echo "::error title=Tests failed on SQLite $name::$(grep -E 'FAIL!|what\(\)|tests passed' "ctest-$name.log" | head -20 | tr '\n' ' ')"
              exit 1
            }
          }
          check 3370200 2022 cb25df0fb90b77be6660f6ace641bbea88f3d0441110d394ce418f35f7561bb0
          check 3310100 2020 f3c79bc9f4162d0b06fa9fe09ee6ccd23bb99ce310b792c5145f87fbcc30efca

      - name: Install, then validate what a desktop would actually read
        run: |
          set -eux
          cmake --install build --prefix "$PWD/staging"
          APPID=io.github.sudomonas.Napkin
          test -x "staging/bin/napkin"
          test -f "staging/share/applications/$APPID.desktop"
          test -f "staging/share/metainfo/$APPID.metainfo.xml"
          test -f "staging/share/icons/hicolor/256x256/apps/$APPID.png"
          sudo apt-get install -y desktop-file-utils appstream
          # The id, the .desktop basename and the icon name are one identity to
          # AppStream and to Flathub; a mismatch means the listing and the
          # launcher are unrelated objects, which is not something a build
          # failure would otherwise catch.
          desktop-file-validate "staging/share/applications/$APPID.desktop"
          appstreamcli validate --no-net "staging/share/metainfo/$APPID.metainfo.xml"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            build/Testing/Temporary/
            ctest.log

  # Gating since Windows started shipping (Phase 9). It began as an
  # informational job that replaced guesses about the port with build logs;
  # SPEC §16 records what it found.
  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats
          cache: true

      # fts5 explicitly: search is built on it, and a port whose default
      # feature set changed would otherwise fail only at the first query.
      - name: Install SQLite
        run: vcpkg install "sqlite3[fts5]:x64-windows"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Show the toolchain
        run: |
          echo "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          echo "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          $out = cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $msg = ($out | Select-Object -Last 25) -join ' '
            Write-Host "::error title=Windows configure failed::$msg"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          # -k 0: every failing file in one run, not only the first. Each
          # round trip through CI is the only way this port gets compiled.
          $out = cmake --build build --parallel -- -k 0 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $msg = ($out | Select-String -Pattern 'error C[0-9]+|error LNK|fatal error' | Select-Object -First 25) -join ' '
            Write-Host "::error title=Windows build failed::$msg"
            exit 1
          }

      - name: Test
        env:
          NAPKIN_RENDER_DIR: ${{ github.workspace }}/renders/windows-light-desktop
        shell: pwsh
        run: |
          $out = ctest --test-dir build --output-on-failure --parallel 2 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $msg = ($out | Select-String -Pattern 'FAIL!|tests passed|\*\*\*|Exception|Failed' | Select-Object -First 30) -join ' '
            Write-Host "::error title=Windows tests failed::$msg"
            # ctest's summary names the suite but not the failing check, and the
            # job log is not public; re-run each failed suite and annotate it whole.
            $env:QT_QPA_PLATFORM = 'offscreen'
            if (-not (Test-Path build\Testing\Temporary\LastTestsFailed.log)) { Write-Host '::error title=No LastTestsFailed.log::ctest left no list of failures' }
            Get-Content build\Testing\Temporary\LastTestsFailed.log -ErrorAction SilentlyContinue | ForEach-Object {
              $t = ($_ -split ':')[1]
              # test_native_style is only meaningful on the real platform.
              if ($t -eq 'test_native_style') { Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue } else { $env:QT_QPA_PLATFORM = 'offscreen' }
              & "build\$t.exe" -o "$t.txt,txt" | Out-Null
              $raw = Get-Content "$t.txt" -Raw -ErrorAction SilentlyContinue
              # Passes and Qt's warnings left out: an annotation is cut at about
              # 4 KB, and test_canvas's warnings alone filled it before the FAIL.
              $detail = "exit $LASTEXITCODE | " + (($raw -split "`r?`n" | Where-Object { $_ -notmatch '^(PASS |QWARN|QDEBUG|QINFO)' }) -join ' | ')
              Write-Host "::error title=$t::$detail"
            }
            exit 1
          }

      # The report that prompted test_native_style was Windows in dark mode
      # with Napkin left on System, which the runner (light by default) cannot
      # show. Qt reads the same per-user setting Windows' own Settings app
      # writes, so flip it and run that suite again.
      - name: Native style with Windows in dark mode
        if: always()
        shell: pwsh
        env:
          NAPKIN_RENDER_DIR: ${{ github.workspace }}/renders/windows-dark-desktop
        run: |
          Set-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize -Name AppsUseLightTheme -Value 0 -Type DWord -Force
          & build\test_native_style.exe -o native-dark.txt,txt | Out-Null
          $code = $LASTEXITCODE
          $raw = Get-Content native-dark.txt -Raw
          $raw | Write-Host
          if ($code -ne 0) {
            Write-Host "::error title=Dark desktop: test_native_style::$(($raw -split "`r?`n" | Where-Object { $_ -notmatch '^PASS ' }) -join ' | ')"
            exit 1
          }

      # Renders of every control in every theme, so what the Windows style
      # actually drew can be looked at from anywhere.
      - name: Upload control renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-control-renders
          path: renders/
          if-no-files-found: warn
